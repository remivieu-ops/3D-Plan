<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1714">
<title>Vérane · Showroom 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --terre:#b5573a;--terre-f:#8f3f26;--creme:#f4efe6;--noir:#1d1b19;--sauge:#8f9c84;
  --disp:'Fraunces','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --txt:'Jost','Futura','Avenir Next','Century Gothic','Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#15110f;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.drag{cursor:grabbing}
.verre{background:rgba(246,241,233,.62);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 34px rgba(30,16,10,.22),inset 0 1px 0 rgba(255,255,255,.7)}
#cartouche{position:fixed;z-index:3;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
  padding:11px 18px 12px 15px;border-radius:14px;border-left:4px solid var(--terre);pointer-events:none;max-width:calc(100vw - 24px)}
#cartouche .marque{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:.18em;color:var(--noir);line-height:1.1;margin:0}
#cartouche .marque span{color:var(--terre)}
#cartouche .sous{font-family:var(--txt);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#4f4740;margin:4px 0 0}
#barre{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  max-width:calc(100vw - 20px);display:flex;gap:3px;padding:4px;border-radius:999px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;white-space:nowrap}
#barre::-webkit-scrollbar{display:none}
#barre button{flex:0 0 auto;min-height:44px;min-width:44px;padding:0 17px;border:0;border-radius:999px;background:transparent;
  font-family:var(--txt);font-size:14.5px;font-weight:500;color:#2c2520;cursor:pointer;letter-spacing:.03em;transition:background .25s,color .25s}
#barre button:hover{background:rgba(181,87,58,.1)}
#barre button.on{background:var(--terre);color:#fff;box-shadow:0 3px 12px rgba(181,87,58,.38)}
#barre button:focus-visible{outline:2px solid var(--terre);outline-offset:2px}
#prog{position:fixed;z-index:4;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--terre),#d98a5f);
  opacity:0;transition:opacity .5s;pointer-events:none}
#aide{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 22px;border-radius:16px;
  font-family:var(--txt);font-size:14px;color:#2c2520;text-align:center;line-height:1.75;pointer-events:none;opacity:0;transition:opacity .9s;width:max-content;max-width:calc(100vw - 40px)}
#aide b{font-weight:600;color:var(--terre-f)}
#aide.vis{opacity:1}
#chargement{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 45%,#4a2a1e 0,#1f1510 55%,#110c0a 100%);color:var(--creme);transition:opacity .7s}
#chargement .t{font-family:var(--disp);font-size:32px;letter-spacing:.3em;padding-left:.3em}
#chargement .s{font-family:var(--txt);font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
#chargement .l{width:140px;height:2px;background:rgba(255,255,255,.15);overflow:hidden;border-radius:2px}
#chargement .l i{display:block;height:100%;width:40%;background:var(--terre);animation:va 1.2s ease-in-out infinite}
@keyframes va{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#message{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(17,12,10,.88)}
#message .boite{max-width:460px;padding:24px 26px;border-radius:16px;font-family:var(--txt);color:#2c2520;line-height:1.6}
#message h2{font-family:var(--disp);font-weight:600;font-size:22px;margin:0 0 8px;color:var(--terre-f)}
@media (max-width:520px){
  #cartouche{padding:9px 14px 10px 12px}
  #cartouche .marque{font-size:18px}
  #cartouche .sous{font-size:10px;letter-spacing:.12em}
  #barre button{padding:0 14px;font-size:14px}
  #aide{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  #chargement .l i{animation:none;width:100%}
  #aide,#prog,#chargement{transition:none}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Scène 3D interactive : îlot showroom mobilier, salon intérieur et terrasse extérieure"></canvas>

<div id="cartouche" class="verre">
  <p class="marque">VÉRANE <span>·</span> MAISON</p>
  <p class="sous">Intérieur · Extérieur — Îlot showroom</p>
</div>

<nav id="barre" class="verre" aria-label="Vues prédéfinies">
  <button data-v="tq" class="on">Trois-quarts</button>
  <button data-v="face">Intérieur</button>
  <button data-v="dos">Extérieur</button>
  <button data-v="rayon">Rayon</button>
  <button data-v="cote">Côté</button>
  <button data-v="tour">Visite auto</button>
</nav>

<div id="aide" class="verre" role="status"></div>
<div id="prog"></div>

<div id="chargement">
  <div class="t">VÉRANE</div>
  <div class="s" id="chTxt">Préparation du showroom…</div>
  <div class="l"><i></i></div>
</div>

<div id="message"><div class="boite verre"><h2 id="msgT"></h2><div id="msgB"></div></div></div>

<script>
'use strict';

/* =====================================================================

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

  return o;

  vert(p, n, u, v, m) {
    for (let k = this.stack.length - 1; k >= 0; k--) { const T = this.stack[k]; p = xp(T, p); n = xn(T, n); }
    if ((this.vn + 1) * ST > this.v.length) { const t = new Float32Array(this.v.length * 2); t.set(this.v); this.v = t; }
    const a = this.v, o = this.vn * ST;

    a[o + 6] = u; a[o + 7] = v; a[o + 8] = m.c[0]; a[o + 9] = m.c[1]; a[o + 10] = m.c[2];
    a[o + 11] = m.r; a[o + 12] = m.m; a[o + 13] = m.cc; a[o + 14] = m.e; a[o + 15] = m.L; a[o + 16] = m.f;
    return this.vn++;

  tri(a, b, c) {
    if (this.n + 3 > this.ix.length) { const t = new Uint32Array(this.ix.length * 2); t.set(this.ix); this.ix = t; }
    this.ix[this.n++] = a; this.ix[this.n++] = b; this.ix[this.n++] = c;

      this.tri(a, b, d); this.tri(a, d, c);

/* Boîte à angles arrondis */
function axisC(half, r, rs) {

  for (let k = 0; k < rs; k++) o.push(-inner - r * Math.cos(k / rs * Math.PI / 2));

/* Révolution (lathe) : profil [[rayon, y], …] de bas en haut */

  if (!still) {

    if (scaleCool <= 0) {
      if (ema > (MOBILE ? 40 : 34) && renderScale > Q.minScale) { renderScale = Math.max(Q.minScale, renderScale - 0.1); scaleCool = 1.2; ema = 20; }
      else if (ema < 20 && renderScale < Q.maxScale) { renderScale = Math.min(Q.maxScale, renderScale + 0.05); scaleCool = 2.5; }
    }
  }
  void t0;
}

/* =====================================================================
   Interactions
   ===================================================================== */
const pts = new Map();
let dragging = false, mode = null, pinch0 = null, lastMove = 0, tap = { t: 0, x: 0, y: 0 };
const rotK = () => 3.6 / Math.max(500, canvas.clientWidth);
function panBy(dx, dy) {
  const s = 2 * goal.dist * Math.tan(goal.fov * Math.PI / 360) / Math.max(1, canvas.clientHeight);
  const cy = Math.cos(goal.yaw), sy = Math.sin(goal.yaw), cp = Math.cos(goal.pitch), sp = Math.sin(goal.pitch);
  const right = [cy, 0, -sy], up = [-sp * sy, cp, -sp * cy];
  for (let i = 0; i < 3; i++) goal.t[i] += -right[i] * dx * s + up[i] * dy * s;
}
function rayFrom(cx, cy) {
  const r = canvas.getBoundingClientRect(), x = (cx - r.left) / r.width * 2 - 1, y = 1 - (cy - r.top) / r.height * 2;
  const cam = camMatrices(cur, null), inv = m4inv(cam.vp);
  const un = (z) => { const v = [x, y, z, 1], o = [0, 0, 0, 0]; for (let i = 0; i < 4; i++) o[i] = inv[i] * v[0] + inv[4 + i] * v[1] + inv[8 + i] * v[2] + inv[12 + i] * v[3]; return [o[0] / o[3], o[1] / o[3], o[2] / o[3]]; };
  const a = un(-1), b = un(1); return { o: a, d: norm(sub(b, a)) };
}
function approach(cx, cy) {
  const { o, d } = rayFrom(cx, cy), lo = [-2.6, 0, -2.2], hi = [2.6, 2.76, 2.2];
  let tn = -1e9, tx = 1e9, ax = -1;
  for (let k = 0; k < 3; k++) {
    if (Math.abs(d[k]) < 1e-9) { if (o[k] < lo[k] || o[k] > hi[k]) { tn = 1e9; } continue; }
    let a = (lo[k] - o[k]) / d[k], b = (hi[k] - o[k]) / d[k]; if (a > b) [a, b] = [b, a];
    if (a > tn) { tn = a; ax = k; } tx = Math.min(tx, b);
  }
  userTook();
  const to = cloneS(goal);
  if (tn <= tx && tn > 0) {
    const h = add(o, scl(d, tn));
    let nrm = [0, 0, 0]; nrm[ax] = Math.sign(-d[ax]);
    if (ax === 1) { if (Math.abs(h[0]) / 2.6 > Math.abs(h[2]) / 2.2) nrm = [Math.sign(h[0]), 0, 0]; else nrm = [0, 0, Math.sign(h[2])]; }
    to.fov = portrait ? 62 : 42;
    if (nrm[2]) {
      to.t = [clamp(h[0], -1.7, 1.7), clamp(h[1], 0.45, 1.2), clamp(h[2] * 0.55, -1.3, 1.3)];
      to.yaw = nrm[2] > 0 ? 0 : Math.PI; to.pitch = 0.24; to.dist = portrait ? 3.4 : 2.6;
    } else if (Math.abs(h[2]) < 0.62) {
      to.t = [2.6 * nrm[0], clamp(h[1], 0.35, 1.9), clamp(h[2], -0.5, 0.5)];
      to.yaw = nrm[0] > 0 ? Math.PI / 2 : -Math.PI / 2; to.pitch = 0.06; to.dist = portrait ? 1.5 : 1.1;
    } else {
      to.t = [1.4 * nrm[0], 0.75, clamp(h[2], -1.6, 1.6)];
      to.yaw = nrm[0] > 0 ? Math.PI / 2 : -Math.PI / 2; to.pitch = 0.24; to.dist = portrait ? 3.2 : 2.5;
    }
  } else if (d[1] < -1e-3) {
    const t = -o[1] / d[1], h = add(o, scl(d, t));
    to.t = [clamp(h[0], -6.5, 6.5), 0.9, clamp(h[2], -6, 6)]; to.dist = Math.min(goal.dist, 3.5); to.pitch = 0.18;
  } else return;
  to.yaw = goal.yaw + wrapPi(to.yaw - goal.yaw);
  trans = { from: cloneS(goal), to, t: 0, dur: reduced ? 0 : 1.0 };
}
canvas.addEventListener('pointerdown', e => {
  canvas.focus({ preventScroll: true });
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  userTook(); vel.yaw = vel.pitch = 0; dragging = true; canvas.classList.add('drag');
  if (e.pointerType === 'mouse') mode = (e.button === 2 || e.shiftKey) ? 'pan' : (e.button === 0 ? 'rot' : (e.button === 1 ? 'pan' : null));
  else {
    if (pts.size === 1) {
      mode = 'rot'; const now = performance.now();
      if (now - tap.t < 320 && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 30) { approach(e.clientX, e.clientY); tap.t = 0; }
      else tap = { t: now, x: e.clientX, y: e.clientY };
    } else if (pts.size === 2) {
      mode = 'pinch'; const [a, b] = [...pts.values()];
      pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    }
  }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  const now = performance.now(), dtm = Math.max(8, now - lastMove) / 1000; lastMove = now;
  p.x = e.clientX; p.y = e.clientY;
  if (mode === 'rot' && pts.size === 1) {
    const k = rotK(); goal.yaw -= dx * k; goal.pitch += dy * k;
    if (!reduced) { vel.yaw = lerp(vel.yaw, -dx * k / dtm, 0.5); vel.pitch = lerp(vel.pitch, dy * k / dtm, 0.5); }
  } else if (mode === 'pan') panBy(dx, dy);
  else if (mode === 'pinch' && pts.size >= 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch0 && d > 10) { goal.dist *= pinch0.d / d; panBy(mx - pinch0.mx, my - pinch0.my); }
    pinch0 = { d, mx, my };
  }
  e.preventDefault();
});
const endPtr = e => {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (performance.now() - lastMove > 90) vel.yaw = vel.pitch = 0;
  if (pts.size === 0) { dragging = false; mode = null; pinch0 = null; canvas.classList.remove('drag'); }
  else if (pts.size === 1) { mode = 'rot'; pinch0 = null; vel.yaw = vel.pitch = 0; }
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr); canvas.addEventListener('lostpointercapture', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); userTook();
  const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  goal.dist *= Math.exp(clamp(dy, -200, 200) * 0.0013);
}, { passive: false });
canvas.addEventListener('dblclick', e => { e.preventDefault(); approach(e.clientX, e.clientY); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  let used = true;
  switch (e.key) {
    case 'ArrowLeft': goal.yaw += 0.12; break;
    case 'ArrowRight': goal.yaw -= 0.12; break;
    case 'ArrowUp': goal.pitch += 0.06; break;
    case 'ArrowDown': goal.pitch -= 0.06; break;
    case '+': case '=': goal.dist *= 0.88; break;
    case '-': case '_': goal.dist *= 1.14; break;
    default: used = false;
  }
  if (used) { e.preventDefault(); trans = null; auto = false; document.querySelectorAll('#barre button').forEach(b => b.classList.remove('on')); hideHelp(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('#barre')) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

document.querySelectorAll('#barre button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.v === 'tour' && auto) { auto = false; b.classList.remove('on'); return; }
  setView(b.dataset.v); hideHelp();
}));
window.addEventListener('resize', () => {
  const p = innerHeight > innerWidth * 1.05;
  if (p !== portrait) { portrait = p; setView(lastView, 0.8); }
});

/* Aide au démarrage */
const aide = $('#aide');
aide.innerHTML = MOBILE
  ? '<b>1 doigt</b> tourner · <b>pincer</b> zoomer<br><b>2 doigts</b> déplacer · <b>double appui</b> s’approcher'
  : '<b>Glisser</b> tourner · <b>clic droit</b> ou <b>Maj + glisser</b> déplacer<br><b>Molette</b> zoomer · <b>double-clic</b> sur un meuble pour s’approcher · <b>flèches</b>, <b>+</b> / <b>−</b>';
let helpTimer = 0, helpShown = false;
function showHelp() { helpShown = true; aide.classList.add('vis'); helpTimer = setTimeout(hideHelp, reduced ? 9000 : 6500); }
function hideHelp() { if (!helpShown) return; clearTimeout(helpTimer); aide.classList.remove('vis'); }

/* =====================================================================
   Démarrage, perte de contexte
   ===================================================================== */
function message(t, b) { $('#msgT').textContent = t; $('#msgB').innerHTML = b; $('#message').style.display = 'flex'; }
function hideMessage() { $('#message').style.display = 'none'; }
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; message('Affichage interrompu', 'Le contexte graphique a été perdu (mémoire ou mise en veille). Restauration en cours…'); });
canvas.addEventListener('webglcontextrestored', () => {
  try { initGL(); lost = false; acc = 0; hideMessage(); }
  catch (err) { message('Affichage impossible', 'La restauration du rendu 3D a échoué. Rechargez la page.'); }
});

async function start() {
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: true, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
  if (!gl) {
    $('#chargement').remove();
    message('WebGL 2 n’est pas disponible', 'Votre navigateur ou votre appareil ne permet pas d’afficher cette scène 3D.<br>Essayez une version récente de Chrome, Edge, Firefox ou Safari, et vérifiez que l’accélération matérielle est activée.');
    return;
  }
  try {
    await Promise.race([
      Promise.all([document.fonts.load(`600 40px Fraunces`), document.fonts.load(`400 20px Jost`), document.fonts.load(`500 20px Jost`), document.fonts.load(`300 20px Jost`), document.fonts.load(`600 20px Jost`)]),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch (_) { }
  $('#chTxt').textContent = 'Installation du mobilier…';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  try {
    TEXCV = drawTextures();
    SCENE = buildScene();
    initGL();
  } catch (err) {
    console.error(err);
    $('#chargement').remove();
    message('Affichage impossible', 'Une erreur est survenue pendant la préparation du rendu 3D.<br><small>' + String(err.message || err).slice(0, 300) + '</small>');
    return;
  }
  window.__scene = { tris: (SCENE.S.n + SCENE.F.n + SCENE.G.n) / 3, hdr: HDR, samples: SAMPLES };
  setView('tq', reduced ? 0 : 1.8);
  last = performance.now();
  raf = requestAnimationFrame(tick);
}
start();
})();
</script>
